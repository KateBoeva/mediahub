name: mediahub-test

services:
  db:
    image: postgres:18-alpine
    env_file:
      - service.env
    environment:
      TZ: "Europe/Moscow"
      POSTGRES_DB: mediahub
    ports:
      - "${TEST_DB_PORT:-15434}:5432"
    tmpfs:
      - /var/lib/postgresql
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 1s
      retries: 20
